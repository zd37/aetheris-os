workflows:
  aetheris-ios:
    name: Aetheris OS iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: latest
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Build web application
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Resolve Swift packages
        script: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Build iOS application
        script: |
          set -e

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA for re-signing
        script: |
          set -e

          APP_PATH="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/App.app"
          STAGING="$CM_BUILD_DIR/ipa-staging"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Expected App.app was not created."
            find "$CM_BUILD_DIR/build/DerivedData/Build/Products" -name "*.app" -type d
            exit 1
          fi

          mkdir -p "$STAGING/Payload"
          ditto "$APP_PATH" "$STAGING/Payload/App.app"

          cd "$STAGING"
          /usr/bin/zip -qry "$CM_BUILD_DIR/AetherisOS-unsigned.ipa" Payload

          test -s "$CM_BUILD_DIR/AetherisOS-unsigned.ipa"
          echo "Unsigned IPA container created successfully."

    artifacts:
      - AetherisOS-unsigned.ipa
